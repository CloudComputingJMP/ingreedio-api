# JPA
spring.datasource.url=jdbc:postgresql://34.118.116.92:5432/ingreedio-pgsql
spring.datasource.username=postgress
spring.datasource.password=postgress
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mongo
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.database=ingreedio
spring.data.mongodb.username=compose-mongo
spring.data.mongodb.password=compose-mongo

# bucket
bucket.uri=${BUCKET_URI}

#AI
recommendation.url= sth
# Mongo queries
mongodb.query.create-match-score-query=classpath:mongodb/query/create-match-score.json

# Liquibase configuration
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yml

# Security
security.secret=aW5ncmVlZGlvMTIzNDU2Nzg5MDEyMzQ1Njc4OTBpbmdyZWVkaW8=
security.access-token-lifetime=900000
security.refresh-token-lifetime=259200000
security.default-user-roles=USER

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

server.forward-headers-strategy=framework

# Services
